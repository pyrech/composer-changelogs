name: CI

on:
    push:
        branches: [ main ]
    pull_request:
    schedule:
        -   cron: '0 0 * * MON'

permissions:
    contents: read

jobs:
    lint:
        name: Coding standards and static analysis
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.5'
                  coverage: none

            - uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

            - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0

            - run: castor cs

            - run: castor phpstan

    tests:
        name: Tests PHP ${{ matrix.php-version }} (${{ matrix.dependency-versions }} deps, ${{ matrix.minimum-stability }} stability)
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
                dependency-versions: ['highest']
                minimum-stability: ['stable']
                include:
                    - php-version: '8.1'
                      dependency-versions: 'lowest'
                      minimum-stability: 'stable'
                    - php-version: '8.5'
                      dependency-versions: 'highest'
                      minimum-stability: 'dev'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: ${{ matrix.php-version }}
                  coverage: none

            - uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

            - if: matrix.minimum-stability == 'dev'
              run: composer config minimum-stability dev

            - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
              with:
                  dependency-versions: ${{ matrix.dependency-versions }}

            - run: castor test
